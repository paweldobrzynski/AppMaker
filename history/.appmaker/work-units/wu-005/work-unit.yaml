# Multi-output investigation work_unit. PRIMARY output is ADR-003, which
# resolves the schema format choice. SECONDARY outputs are three v1 schema
# files conforming to the chosen format.
#
# Per Codex's WU-005 directive: format choice is architectural, must be in
# ADR; but a separate mini-ADR before WU-005 would be ceremony. WU-005
# combines ADR + schema artifacts following WU-003 multi-output precedent
