# ---------------------------------------------------------------------------
# DECISIONS TO RESOLVE IN ADR-003
# ---------------------------------------------------------------------------
decisions_to_resolve:
  - "D1. Canonical schema format. Four candidates: (a) JSON Schema canonical + YAML examples for humans; (b) Zod canonical + generated JSON Schema; (c) custom YAML schema; (d) hybrid ad hoc. ADR-003 picks one default with rationale; ≥3 alternatives go to killed. GUARD: WU-005 is a no-code investigation (scope blocks `**/*.ts` and other code). If D1 selects a code-backed format (e.g. Zod) that requires a blocked extension to author canonical schemas, ADR-003 must (a) select it but EXPLICITLY DEFER schema-file authoring to a follow-up implementation work_unit (recording the deferral in §Open Questions of ADR-003) — in which case WU-005 produces only ADR-003, not the three schema files; OR (b) drop the code-backed option to killed alternatives. WU-005 cannot author code-backed schemas itself."
  - "D2. Schema directory and naming convention. Recommended: `.appmaker/schemas/<name>-v<n>.schema.<ext>` with `<n>` incremental. ADR-003 confirms or adjusts."
  - "D3. Schema versioning policy. v1 is initial; how do v2+ supersede v1? Mandatory deprecation period? Co-existence? ADR-003 picks policy."
  - "D4. Validation conformance requirements. Which artifacts MUST be validated against which schema? When is validation invoked (pre-execution, pre-VERIFIED, pre-PROMOTE)? Who runs the validator (kernel, manual, CI)?"
  - "D5. Lessons-derived fields explicit mapping. Each of the 6 wu-005-applicable lessons must map to one or more schema fields with named rationale. ADR-003 lists this mapping as its core deliverable for the memory-layer test."

