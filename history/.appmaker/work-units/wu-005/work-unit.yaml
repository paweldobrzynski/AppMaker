# ---------------------------------------------------------------------------
# GOAL
# ---------------------------------------------------------------------------
goal: |
  Produce four artifacts in one investigation work_unit:

   1. ADR-003 (primary): resolves schema format canonical choice and v1
      schema authoring policy. Includes ≥3 killed alternatives.
   2. interview-result-v1.schema.<ext>: formal schema for the conceptual
      shape established in ADR-002 §schema-shape. Format determined by
      ADR-003 D1.
   3. work-unit-v1.schema.<ext>: formal schema for the ad-hoc work_unit.yaml
      shape used in WU-002, WU-003, WU-004. Must include fields distilled
      from lessons (lessons_applied, cross_decision_consistency,
      affects_core_safety_rules, semantic_relations, forbidden_patterns
      enforcement, etc.). Format determined by ADR-003 D1.
   4. adr-v1.schema.<ext>: formal schema for ADR document structure used
      since ADR-001. Includes forbidden_patterns, required_sections, etc.
      Format determined by ADR-003 D1.

  All three schemas must (a) parse as their declared format, (b) be
  internally consistent with each other where they share concepts (e.g.
  status enum, work_unit type), and (c) trace each non-trivial field
  back to a constitution rule, ADR decision, or lessons.jsonl entry.

