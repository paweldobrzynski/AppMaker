# ---------------------------------------------------------------------------
# OUTPUT TARGETS (multi-output)
# ---------------------------------------------------------------------------
output_targets:
  # Primary: CLI scripts
  - name: appmaker-validate
    role: primary
    artifact_type: bash_script
    promotion_path: bin/appmaker-validate
    description: "Structurally validates work-unit.yaml against work-unit-v1.schema.json (parser + structural; meta-schema deferred per ADR-003 D4). Exit 0 on pass, non-zero on fail."
  - name: appmaker-promote-dry-run
    role: primary
    artifact_type: bash_script
    promotion_path: bin/appmaker-promote
    description: "With --dry-run flag: reads WU work-unit.yaml + checks gate conditions (verification record exists, scorecard pass, etc.) without actually flipping status. Exit 0 if gate would pass, non-zero if blocked. Without --dry-run: not implemented in v1 (out of scope)."
  - name: appmaker-context-compile
    role: primary
    artifact_type: bash_script
    promotion_path: bin/appmaker-context
    description: "With `compile <wu-id>` subcommand: assembles context-pack per R8 (constitution + recent ADRs + WU's acceptance_criteria + filtered lessons per applies_to). Outputs to stdout or to .appmaker/work-units/<wu-id>/context-pack.md. Exit 0 on success."
  - name: appmaker-log-append
    role: primary
    artifact_type: bash_script
    promotion_path: bin/appmaker-log
    description: "With `append <stream> <json-entry>` subcommand: validates JSON entry shape + appends to events.jsonl / lessons.jsonl / decisions.jsonl with timestamp + JSONL formatting. Exit 0 on success, non-zero on invalid JSON or unknown stream."
  # Primary: dogfood missing artifacts
  - name: north-star
    role: primary
    artifact_type: markdown
    promotion_path: north-star.md
    description: "WHY AppMaker exists; meta-AppMaker self-purpose statement (per ADR-001 §D3 6-file model). Currently missing from project root."
  - name: appmaker-config
    role: primary
    artifact_type: yaml
    promotion_path: appmaker.config.yaml
    description: "Project-level config: spec adapter (Spec Kit per ADR-002 D5), provider (anthropic), CLI bin path. Currently missing from project root."
  - name: profile
    role: primary
    artifact_type: yaml
    promotion_path: .appmaker/profile.yaml
    description: "WHAT AppMaker meta-project technically is (advisor output; for v1 hand-written minimal). Currently missing from .appmaker/."
  # Secondary: tests
  - name: cli-tests
    role: secondary
    artifact_type: bash_test_scripts
    promotion_path: tests/cli/
    description: "Bash test scripts that run each CLI command on test fixtures + assert exit codes + diff actual vs expected output. Scripts MUST be invoked by verification_commands (see verification block below)."
  - name: README-cli
    role: secondary
    artifact_type: markdown
    promotion_path: bin/README.md
    description: "CLI usage documentation: synopsis, examples, exit codes, dependencies (jq, PyYAML, Ruby Psych)."

# ---------------------------------------------------------------------------
# SCOPE
# ---------------------------------------------------------------------------
scope:
  allowed_files_read:
    - decisions/ADR-001-process-kernel-architecture.md
    - decisions/ADR-002-interview-phase.md
    - decisions/ADR-003-schema-format-and-artifact-schemas.md
    - decisions/ADR-004-prd-synthesis.md
    - decisions/ADR-005-work-unit-decomposition.md
    - constitution.md
    - .appmaker/schemas/**
    - .appmaker/work-units/**                                          # all prior WUs as reference fixtures
    - .appmaker/lessons.jsonl
    - .appmaker/events.jsonl
    - docs/reference/**
  allowed_files_write:
    - .appmaker/work-units/wu-008/context-pack.md
    - .appmaker/work-units/wu-008/runs/<timestamp>/**
    - bin/**                                                            # CLI scripts (NEW directory)
    - tests/cli/**                                                       # test scripts (NEW directory)
    - north-star.md                                                      # NEW project root file (per ADR-001 §D3)
    - appmaker.config.yaml                                               # NEW project root file
    - .appmaker/profile.yaml                                             # NEW kernel-managed file
  blocked_files_write:
    - decisions/**                                                       # all 5 ADRs immutable
    - constitution.md                                                    # amendments via dedicated WU only
    - .appmaker/schemas/**                                               # v1 schemas immutable
    - .appmaker/work-units/wu-002/**                                     # closed (read OK)
    - .appmaker/work-units/wu-003/**
    - .appmaker/work-units/wu-004/**
    - .appmaker/work-units/wu-005/**
    - .appmaker/work-units/wu-006/**
    - .appmaker/work-units/wu-007/**
    - .appmaker/decisions.jsonl                                           # not yet active
    - .appmaker/events.jsonl                                              # append-only via runner step
    - .appmaker/lessons.jsonl                                             # append-only
    - docs/reference/future-scope-registry.md                             # Codex/user discovery, non-binding
    - docs/reference/project-strategy-notes.md                            # Codex/user discovery, non-binding
    - docs/reference/matt-pocock-pattern-mapping.md                       # not modified by WU-008
  blocked_actions:
    - "git push"
    - "git commit"
    - "git reset --hard"
    - "rm -rf"
    - "npm install"                                                      # CLI is bash-based; no Node deps
    - "git clone"
    - any modification to ADRs, constitution.md, schemas v1, prior closed WUs
  allowed_actions:
    - "read: any file in allowed_files_read"
    - "create: files in allowed_files_write paths"
    - "execute: bash, jq, python yaml, ruby YAML for testing CLI scripts during development"
    - "execute: each produced CLI script + assert exit code (verification_commands)"

# ---------------------------------------------------------------------------
# VERIFICATION (implementation type — verification_commands MUST PASS per ADR-001 §D2a)
# ---------------------------------------------------------------------------
verification:
  type: implementation_command_pass                                       # not artifact_schema (which is investigation type)
  verification_commands:
    # CLI command sanity: each binary exists and is executable
    - "test -x bin/appmaker-validate"
    - "test -x bin/appmaker-promote"
    - "test -x bin/appmaker-context"
    - "test -x bin/appmaker-log"
    # CLI command --help: each command supports --help and exits 0
    - "bin/appmaker-validate --help"
    - "bin/appmaker-promote --help"
    - "bin/appmaker-context --help"
    - "bin/appmaker-log --help"
    # Functional tests on prior promoted WUs (real fixtures, not mocks)
    - "bin/appmaker-validate .appmaker/work-units/wu-002/work-unit.yaml"
    - "bin/appmaker-validate .appmaker/work-units/wu-007/work-unit.yaml"
    # Promote dry-run on already-PROMOTED WU should report gate-passed
    - "bin/appmaker-promote --dry-run wu-007"
    # Context compile produces non-empty markdown for an existing WU
    - "bin/appmaker-context compile wu-007 | grep -q 'AppMaker'"
    # Log append validates JSON structure (negative test: bad JSON exits non-zero)
    - "echo 'not-json' | bin/appmaker-log append events 2>/dev/null; test $? -ne 0"
    # Test suite (full)
    - "bash tests/cli/run-all.sh"
    # Dogfood artifacts present + non-empty
    - "test -s north-star.md"
    - "test -s appmaker.config.yaml"
    - "test -s .appmaker/profile.yaml"
    # Dogfood artifacts parser-clean (per R7)
    - "ruby -ryaml -e 'YAML.load_file(\"appmaker.config.yaml\")'"
    - "ruby -ryaml -e 'YAML.load_file(\".appmaker/profile.yaml\")'"
    # Forbidden patterns absent in markdown dogfood (north-star + README)
    - "! grep -q 'TBD\\|TODO\\|\\.\\.\\.' north-star.md"
    - "! grep -q 'TBD\\|TODO\\|\\.\\.\\.' bin/README.md"

  # NEW for implementation WUs (analog to active cross-decision for investigation):
  active_command_execution_required: true                                 # per WU-007 lesson #4 — verification_commands MUST be RUN, not annotated as scorecard pass
  cross_artifact_consistency_required: true                               # CLI script subcommand names match output_targets descriptions; README examples match actual command output
  human_review_required: true                                             # CLI design choices (subcommand naming, exit code semantics) need human eyes

  secondary_artifacts_policy:
    default: required
    deferred_allowed_only_if:
      - "No deferred path expected for WU-008; tests + README must accompany CLI scripts"

# ---------------------------------------------------------------------------
# VALIDATOR TOOLING PREFLIGHT
# ---------------------------------------------------------------------------
validator_tooling_preflight:
  required: true
  must_record_available_tools: true
  if_selected_format_requires_unavailable_validator: |
    `appmaker validate` is built on parser + structural check using available tools (jq, PyYAML, Ruby Psych).
    Full JSON Schema meta-validation (ajv) deferred per ADR-003 D4 — `appmaker validate` does NOT pretend
    meta-validation; it does field-presence + enum-value + pattern checks against work-unit-v1 schema's
    explicit constraints. Future schemas-extension/validator-implementation WU may add ajv-based meta-validation.
  available_tools_at_baseline:
    - bash (script runtime)
    - jq (JSON parse + query)
    - python yaml (PyYAML safe_load — for YAML parser within bash via `python -c`)
    - ruby YAML (Psych — fallback YAML parser)
    - grep, sed, awk, diff (markdown structural inspection)
  unavailable_at_baseline:
    - ajv (Node.js) — deferred per ADR-003 OQ-1
    - python jsonschema package — deferred per ADR-003 OQ-1
    - any TS runtime (per ADR-001 §D10 CLI-first)

# ---------------------------------------------------------------------------
# ACCEPTANCE CRITERIA
# ---------------------------------------------------------------------------
acceptance_criteria:
  # CLI commands present + executable + functional
  - "4 CLI scripts produced at bin/appmaker-{validate,promote,context,log}; all executable (test -x)"
  - "Each CLI script supports --help and exits 0 on --help"
  - "appmaker-validate exits 0 on every existing .appmaker/work-units/wu-NNN/work-unit.yaml (WU-002 through WU-007); exits non-zero on intentionally-broken test fixture"
  - "appmaker-promote --dry-run wu-007 reports gate-passed (since WU-007 is PROMOTED); appmaker-promote --dry-run on a WU with missing verification record reports gate-blocked"
  - "appmaker-context compile wu-NNN produces non-empty markdown including: '## ' headers, references to constitution.md, references to relevant ADRs, references to acceptance_criteria from work-unit.yaml, filtered lessons per applies_to"
  - "appmaker-log append <stream> '<json>' validates JSON structure (rejects malformed JSON with non-zero exit); appends to correct stream file (events.jsonl / lessons.jsonl); writes valid JSONL line"
  # Dogfood artifacts present + valid
  - "north-star.md present at project root, non-empty, no forbidden patterns"
  - "appmaker.config.yaml present at project root, parser-valid YAML, contains at minimum: adapter (spec_kit per ADR-002 D5), provider, cli_bin_path"
  - ".appmaker/profile.yaml present, parser-valid YAML, contains at minimum: type (meta_appmaker_self_development), language (markdown_yaml_bash), purpose"
  # Tests
  - "tests/cli/ directory with bash test scripts; tests/cli/run-all.sh aggregates and exits 0 on all-pass"
  - "Test coverage: each CLI command has at least one positive test (valid input → exit 0) and at least one negative test (invalid input → non-zero exit)"
  - "Tests use real fixtures (existing work-unit.yaml from WU-002..WU-007); no mocks of AppMaker artifacts"
  # Cross-artifact consistency
  - "CLI script subcommand names exactly match descriptions in output_targets section of this work-unit.yaml; bin/README.md examples use exactly those subcommands"
  - "ALL verification_commands listed in verification.verification_commands actually executed during VERIFIED step; exit codes recorded in verification log"
  # Manual schema conformance for the CLI-produced artifacts (eat dogfood)
  - "After bin/appmaker-validate is built, run it on THIS work-unit.yaml (wu-008/work-unit.yaml) — should pass (or surface real schema gaps to fix in next WU). Self-validation result recorded in verification log."
  # No scope leakage
  - "No edits to ADRs, constitution.md, schemas v1, prior closed WUs (wu-002..wu-007)"
  - "No new ADRs produced; no new lessons.jsonl entries (closeout follows promote)"
  - "Forbidden patterns absent in north-star.md and bin/README.md (per R7-derived discipline)"

# ---------------------------------------------------------------------------
# REVIEW SCORECARD
# ---------------------------------------------------------------------------
review_required_from:
  - critic
  - human

review_scorecard_template:
  cli_commands_executable: pending
  cli_help_exits_zero: pending
  validate_passes_on_real_fixtures: pending
  validate_fails_on_broken_fixture: pending
  promote_dry_run_correct: pending
  context_compile_produces_pack: pending
  log_append_validates_json: pending
  dogfood_artifacts_present: pending
  dogfood_artifacts_parser_clean: pending
  test_suite_runs_clean: pending
  cross_artifact_consistency: pending                                     # script names ↔ README ↔ work-unit.yaml output_targets
  forbidden_patterns_absent: pending
  scope_discipline: pending                                               # no scope leak into ADRs/constitution/schemas
  self_validation_recorded: pending                                       # appmaker-validate run on wu-008/work-unit.yaml itself

# ---------------------------------------------------------------------------
# EXECUTION
# ---------------------------------------------------------------------------
execution:
  mode: single
  agent: claude (default)
  context_pack: .appmaker/work-units/wu-008/context-pack.md
  estimated_effort: 4-6 hours                                             # bigger than investigation WUs — actual code + tests + dogfood

# ---------------------------------------------------------------------------
# GATES
# ---------------------------------------------------------------------------
promote_gate:
  default_decision: reject
  on_missing_field: reject
  on_error: reject
  required_pass:
    - "verification.verification_commands.all_exit_zero: true"            # primary gate for implementation type
    - "verification.active_command_execution_required: true"
    - "verification.cross_artifact_consistency_required: pass"
    - validator_tooling_preflight.recorded: true
    - "review.human: pass"
  break_glass:
    allowed: false                                                         # CLI is foundational; no escape hatch

# ---------------------------------------------------------------------------
# RISKS
# ---------------------------------------------------------------------------
risks:
  - "CLI scope creep — adding `appmaker init`, `appmaker interview`, `appmaker prd`, `appmaker decompose` would balloon WU-008. Mitigation: scope explicit at 4 commands; OQ for each future command."
  - "appmaker-validate built without ajv produces false sense of full validation. Mitigation: explicit deferral wording in --help output + bin/README.md; per validator_tooling_preflight."
  - "Bash scripts brittle across shells. Mitigation: target bash 4+ explicit; tests run in bash; no zsh-specific features."
  - "Tests use real fixtures but real fixtures may evolve. Mitigation: tests pin to specific WU directories that are PROMOTED (immutable); no live mutations during test."
  - "Dogfood artifacts (north-star.md, config, profile) take editorial choices that should be human decisions. Mitigation: minimal hand-written; explicit OQ for elaboration via dedicated future WU; do not over-specify."
  - "Cross-artifact consistency (CLI scripts ↔ README ↔ output_targets) drift after promote. Mitigation: review_scorecard explicit field; verification_command checks README examples produce expected output."
  - "Self-validation paradox: appmaker-validate on wu-008/work-unit.yaml may surface real schema gaps that block VERIFIED. Mitigation: gaps recorded; if gap found, decide whether to (a) fix work-unit.yaml, (b) fix validator (if validator over-strict), or (c) defer to schemas-extension WU."

# ---------------------------------------------------------------------------
# ROLLBACK
# ---------------------------------------------------------------------------
rollback_plan: |
  Soft rollback: future WU may revise specific CLI commands (e.g., subcommand renaming, new flags). Backward-compat handled by version flag in CLI scripts.

  Hard rollback: archive bin/* + tests/cli/* + 3 dogfood artifacts to .appmaker/_archive/cli-attempt-N/. Restore prior state (no CLI; AppMaker remains documentation-only). Subsequent WUs revert to manual workflow. No data loss; events.jsonl + lessons.jsonl untouched (CLI did not modify them retroactively).

# ---------------------------------------------------------------------------
# NOTES
# ---------------------------------------------------------------------------
notes: |
