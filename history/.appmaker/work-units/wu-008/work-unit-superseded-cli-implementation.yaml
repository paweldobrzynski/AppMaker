title: "Minimal AppMaker CLI Gate + dogfood artifacts (north-star, config, profile)"
type: implementation                      # FIRST implementation-type WU; verification = command-pass, not artifact-schema
status: PROPOSED                          # PROPOSED | ACCEPTED | IN_PROGRESS | VERIFIED | PROMOTED | PROMOTED_WITH_EXCEPTION | REJECTED
