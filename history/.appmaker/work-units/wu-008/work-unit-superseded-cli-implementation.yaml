  paused_meta_adrs: [ADR-006, ADR-007, ADR-008, ADR-009]
  paused_until: "minimal CLI gate (this WU) lands and/or real-project pilot exists"
  pause_recorded_in_events: "events.jsonl entry retro_recorded for wu-007 with roadmap_correction field 2026-05-10T09:30:00Z"
  meta_appmaker_decomposition_gate_exception: "Per ADR-005 §D4, decomposition is required gate before implementation work_units. AppMaker meta-project (this kernel itself) has no PRD → no decomposition. The gate applies to PROJECTS USING AppMaker, not to AppMaker meta-development. Once WU-008 promotes and CLI exists, AppMaker may dogfood future development through full lifecycle (interview → PRD → decomposition → implementation). Until then, meta-AppMaker development is bootstrap-style (constitution R2 covers ADR bootstrap; this is implementation bootstrap — different category)."

