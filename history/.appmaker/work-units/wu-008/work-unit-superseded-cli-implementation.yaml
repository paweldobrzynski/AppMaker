# ---------------------------------------------------------------------------
# GOAL
# ---------------------------------------------------------------------------
goal: |
  Build the minimal AppMaker CLI gate that turns AppMaker from documentation
  into an executable harness. Plus fill missing dogfood artifacts that
  ADR-001 §D3 6-file model declares but AppMaker meta-project does not yet
  have on disk (north-star.md, appmaker.config.yaml, .appmaker/profile.yaml).

  CLI commands (4):
    1. `appmaker validate <work-unit.yaml>` — structural check against work-unit-v1.schema.json
    2. `appmaker promote --dry-run <wu-id>` — check gate conditions without actually promoting
    3. `appmaker context compile <wu-id>` — assemble context-pack per R8 (constitution + recent ADRs + AC + relevant lessons)
    4. `appmaker log append <stream> <json-entry>` — validated append to events.jsonl / lessons.jsonl / decisions.jsonl

  Missing dogfood artifacts (3):
    - `north-star.md` (project root) — WHY AppMaker exists; meta-AppMaker self-purpose statement
    - `appmaker.config.yaml` (project root) — config (adapter choice: Spec Kit; provider; etc.)
    - `.appmaker/profile.yaml` — minimal hand-written; future Advisor work_unit will auto-generate

  After WU-008 promote: AppMaker dogfoods itself. Subsequent WUs use the CLI
  for validation / context compile / dry-run promote / log append.

