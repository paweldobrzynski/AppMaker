# ---------------------------------------------------------------------------
risks:
  - "Spec under-specifies UX, leaving WU-009 with too much ambiguity. Mitigation: 7 sections enumerated with concrete acceptance criteria; S2 happy path concrete example mandatory."
  - "Spec over-specifies, locking WU-009 into bad UX choices before real user feedback. Mitigation: bounds 200–400 lines (forces concise); explicit OQ for revision after WU-009 ships."
  - "Cross-section/cross-artifact inconsistency. Mitigation: verification.cross_section_consistency_active_step + cross_artifact_consistency_active_step (per WU-006 lessons) — ACTIVELY EXECUTED, not passive scorecard."
  - "Scope creep — adding more public commands or dogfood artifacts mid-execution. Mitigation: blocked_files_write + AC #3/#4 explicit count constraints."
  - "Strategic correction signal not preserved across future sessions. Mitigation: events.jsonl entry strategic_correction; superseded WU-008 contract preserved with notice; lessons closeout will record."
  - "User-facing UX choices made by agent without human input. Mitigation: review_scorecard.human_review pending; human_review_required: true; user explicitly approves spec before promote."
  - "S7 'preserves R4/R5/R7/R8' becomes hand-wavy. Mitigation: AC #11 each rule MUST be addressed with concrete preservation strategy; reviewer cross-checks against constitution.md text."

