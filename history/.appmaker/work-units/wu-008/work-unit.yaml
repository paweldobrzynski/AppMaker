# ---------------------------------------------------------------------------
# GOAL
# ---------------------------------------------------------------------------
goal: |
  Define AppMaker v0 from the USER's perspective before implementing any CLI
  code. Produce a single concise product/interface definition artifact that
  answers: who uses AppMaker, what they see, what they do, what they don't see,
  and how the future Friendly CLI wraps existing kernel primitives without
  weakening governance constitutional rules.

  Output: docs/appmaker-interface-v0.md — concise (target 200–400 lines)
  human-readable spec covering 7 sections per user/Codex directive.

  Public UX surface (4 commands — to be implemented in WU-009):
    1. `appmaker start "<request>"` — entry point; user states what they want
    2. `appmaker status` — what's currently happening / blocked / waiting on human
    3. `appmaker review` — show me what's ready for me to look at
    4. `appmaker approve` — give explicit human approval for items requiring it

  Internal/admin primitives (NOT part of public UX; available in admin/debug mode):
    - `appmaker validate <work-unit.yaml>` (kernel structural validation)
    - `appmaker context compile <wu-id>` (kernel context-pack assembly)
    - `appmaker log append <stream> <json>` (kernel structured logging)
    - `appmaker promote --dry-run <wu-id>` (kernel gate check)

  WU-008 produces ONLY the interface spec. WU-009 implements the friendly CLI
  on top of kernel primitives. Old WU-008 (CLI implementation) preserved for
  audit; not executed.

