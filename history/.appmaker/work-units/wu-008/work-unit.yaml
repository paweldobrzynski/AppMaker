# ---------------------------------------------------------------------------
# SECTIONS TO DEFINE IN INTERFACE SPEC (per user directive — 7 sections)
# ---------------------------------------------------------------------------
sections_to_define:
  - "S1. User personas — who uses AppMaker (developer building a project, project owner reviewing, etc.); for each: experience level, primary use case, what they need from interface."
  - "S2. Happy path for `appmaker start \"<request>\"` — step-by-step: user types command, AppMaker classifies request lane (per S3), creates work_unit(s), runs through interview/PRD/decomposition lifecycle as needed, surfaces output. Concrete walkthrough with example request."
  - "S3. Work lanes: micro_change, normal, high_risk, meta_repair. For each: definition (what kind of request triggers this lane), lifecycle stages applied (skip interview/PRD for micro? full lifecycle for high_risk?), default autonomy (autonomous for micro? human-required for high_risk?), example user request."
  - "S4. When AppMaker asks human vs acts autonomously — decision matrix: combination of (lane × constitution-rule-touched × execution_class × risk_surface) → ask | act. Cross-references constitution R11 (schema/auth/secrets/prod human approval), ADR-005 §D2 execution_class (human_required vs autonomous slices), ADR-002 §D6 ready_with_override (when ambiguity blocks autonomy)."
  - "S5. What the user sees at end — concrete outputs per work_unit completion: changed files (diff list), verification (per verification_command pass/fail), risks (from work-unit.yaml risks block), review required (explicit list of items needing human approval per S4 matrix). No 'feels right' summaries; everything itemized + verifiable."
  - "S6. What's hidden from user vs exposed only in admin/debug mode — public sees: changed files, verification results, risks, what to approve. Hidden by default: work-unit.yaml internals, context-pack assembly, kernel primitive invocations, lessons.jsonl entries, events.jsonl, schemas. Admin/debug mode (`--admin` or `--debug` flag): exposes all internals for kernel troubleshooting."
  - "S7. How future UX wraps existing kernel primitives without weakening R4/R5/R7/R8. Specifically: friendly `appmaker start` translates to internal `validate + context compile + log append + (eventually) promote --dry-run + ...` calls. Each wrap preserves: R4 (promote requires verification), R5 (gates fail closed), R7 (machine-readable artifacts pass parser), R8 (context-pack includes constitution + ADRs + AC + relevant lessons). UX never bypasses these — it makes them invisible-by-default but recoverable."

