# ---------------------------------------------------------------------------
# ACCEPTANCE CRITERIA
# ---------------------------------------------------------------------------
acceptance_criteria:
  - "Interface spec has all 7 required sections in declared order: S1 User personas, S2 Happy path appmaker start, S3 Work lanes (micro_change/normal/high_risk/meta_repair), S4 Ask-vs-act decision matrix, S5 What user sees at end, S6 Hidden vs admin/debug exposed, S7 UX wraps kernel primitives without weakening R4/R5/R7/R8."
  - "Spec length 200–400 lines (concise per user directive)."
  - "Spec defines exactly 4 public UX commands (appmaker start, status, review, approve) — no more, no less; no 'reserved' future commands per WU-007 lesson scope_creep_via_reservation."
  - "Spec explicitly enumerates 4 internal/admin primitives (appmaker validate, context compile, log append, promote --dry-run) AND specifies they are hidden from public UX (per S6); NOT removed from kernel — just not surfaced as default UX."
  - "S1 defines at least 2 user personas with concrete attributes (experience, use case, interface needs); each persona traced through S2 happy path."
  - "S2 includes concrete walkthrough with example request (e.g. `appmaker start \"add login form to my app\"`); shows step-by-step what user types, what AppMaker shows back, what user does next."
  - "S3 work lanes table with 4 rows × at least 4 columns (lane name, definition, lifecycle stages applied, default autonomy, example request)."
  - "S4 decision matrix explicitly cross-references: constitution R11 (schema/auth/secrets/prod), ADR-005 §D2 execution_class (human_required vs autonomous), ADR-002 §D6 ready_with_override."
  - "S5 outputs MUST be itemized + verifiable per WU-005 lesson verifiability_bias: concrete diff list (not 'changes made'), per-command pass/fail (not 'tests ok'), enumerable risks (not 'risks identified'), explicit approval list (not 'review needed')."
  - "S6 explicit list of hidden artifacts (work-unit.yaml internals, context-pack assembly, kernel primitive invocations, lessons.jsonl, events.jsonl, schemas) AND explicit `--admin` / `--debug` mechanism that surfaces them when user opts in."
  - "S7 explicitly addresses each of constitution R4, R5, R7, R8 with concrete preservation strategy: how friendly UX makes them invisible-by-default WITHOUT bypassing them."
  - "Cross-section consistency: S3 lanes ↔ S4 autonomy thresholds ↔ S5 outputs ↔ S6 hidden-list all internally aligned (per WU-006 lesson cross_decision_consistency_active_check applied to spec sections)."
  - "Cross-artifact consistency: kernel primitive names in S6/S7 EXACTLY match names in superseded CLI contract (validate, promote --dry-run, context compile, log append) — no drift; constitution rule references (R4/R5/R7/R8) cross-checked against actual constitution.md text."
  - "Forbidden patterns absent: zero TBD, zero TODO, zero bare ellipsis."
  - "No code produced (no .ts, .json, .sh, .py, .yaml outside contract/context-pack); no dogfood artifacts (north-star.md, appmaker.config.yaml, .appmaker/profile.yaml — those move to WU-009 or later); no edits to ADRs/constitution/schemas/prior WUs/superseded contract."
  - "Spec ends with explicit pointer to WU-009: 'Implement Friendly CLI v0 based on this interface definition'. WU-009 is named but not specified here (just acknowledged as next)."

