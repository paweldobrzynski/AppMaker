verification:
  type: investigation_artifact_validation
  primary_artifact:
    name: appmaker-interface-v0
    schema: "ad-hoc 7-section spec (S1-S7 per sections_to_define)"
    required_sections:
      - "S1. User personas"
      - "S2. Happy path for `appmaker start`"
      - "S3. Work lanes"
      - "S4. Ask vs act decision matrix"
      - "S5. What the user sees at end"
      - "S6. Hidden vs admin/debug exposed"
      - "S7. UX wraps kernel primitives without weakening R4/R5/R7/R8"
    forbidden_patterns: ["TBD", "TODO", "..."]
    bounds_lines: { min: 200, max: 400 }
    public_commands_count: 4                                              # exactly: start, status, review, approve
    internal_primitives_count: 4                                          # exactly: validate, context compile, log append, promote --dry-run
    constitution_rules_referenced_in_S7: ["R4", "R5", "R7", "R8"]         # all 4 must be addressed
  cross_section_consistency_active_step:                                  # per WU-006 lesson #1, applied to spec sections
    required: true
    pairs_to_diff:
      - "S3 (work lanes) ↔ S4 (autonomy thresholds per lane)"
      - "S3 (work lanes) ↔ S5 (per-lane output expectations)"
      - "S4 (ask vs act) ↔ S6 (hidden vs exposed — what user sees when AppMaker asks)"
      - "S6 (hidden artifacts) ↔ S7 (kernel primitives — every hidden artifact is touched by which primitive)"
      - "S2 (happy path) ↔ S3 (lanes — happy path covers at least one example per lane?)"
  cross_artifact_consistency_active_step:                                 # per WU-006 lesson #2
    required: true
    artifacts_to_compare:
      - "Spec S6/S7 kernel primitive names ↔ superseded CLI contract output_targets (validate/promote/context/log) — names must match"
      - "Spec S7 constitution rule references (R4/R5/R7/R8) ↔ actual constitution.md rule text — semantic alignment"
      - "Spec S3 lanes ↔ existing work-unit-v1 schema fields (status enum, type enum, execution_class) — no contradiction"
  within_section_wording_consistency_required: true                       # per WU-006 lesson #3
  human_review_required: true

