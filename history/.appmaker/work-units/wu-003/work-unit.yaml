  authored in the next step.

  Pattern mapping doc semantics (docs/reference/matt-pocock-pattern-mapping.md):
    - This is "append-oriented", NOT strictly append-only.
    - New pattern adoptions are APPENDED by future ADR work_units (ADR-003 adds to-prd row, ADR-004 adds to-issues row, etc.).
    - Corrections (typos, malformed fields) are allowed via dedicated work_unit that updates the doc's revision history; no silent rewrites.
    - This is NOT the audit stream — events.jsonl, decisions.jsonl, lessons.jsonl are governed by constitution R10 (strict append-only). The mapping doc is reference material, not auditable history.
    - WU-003 creates the doc with exactly two entries (grill-me, grill-with-docs) plus a header explaining the append-oriented convention.
