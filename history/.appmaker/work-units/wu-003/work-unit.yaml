id: wu-003
title: "Draft ADR-002: Interview Phase as First Lifecycle Stage"
type: investigation
status: PROMOTED                          # PROPOSED | ACCEPTED | IN_PROGRESS | VERIFIED | PROMOTED | PROMOTED_WITH_EXCEPTION | REJECTED
# status: PROPOSED → ACCEPTED 2026-05-09 (Codex review pass after Matt Pocock path fix + blocked_files_write rename + pattern mapping append-oriented secondary output)
