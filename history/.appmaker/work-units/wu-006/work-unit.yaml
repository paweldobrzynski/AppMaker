# ---------------------------------------------------------------------------
verification:
  primary_artifact:
    name: ADR-004
    schema: adr-v1
    required_sections:
      - "Status"
      - "Metadata"
      - "Context"
      - "Sources Consulted"
      - "Decision (numbered)"
      - "Killed Alternatives"
      - "Risks and Mitigations"
      - "Rollback Plan"
      - "Open Questions"
      - "Acceptance Criteria"
      - "Verification"
      - "Revision History"
    forbidden_patterns: ["TBD", "TODO", "..."]
    bounds_lines: { min: 250, max: 550 }
    minimum_decisions_resolved: 5
    minimum_alternatives_killed: 3
    lessons_traceability_required: true
    matt_pocock_attribution_required: true
    matt_pocock_quotation_must_cite_path: true
