# ---------------------------------------------------------------------------
# DECISIONS TO RESOLVE IN ADR-004
# ---------------------------------------------------------------------------
decisions_to_resolve:
  - "D1. PRD definition: what IS a PRD in AppMaker context? What does it answer, what does it explicitly NOT answer? How does it differ from an ADR (architectural decisions about how) and from an implementation plan (work_unit decomposition / vertical slices)? PRD is product-level what-to-build reference; ADR captures structural decisions; implementation plan is the slicing of work."
  - "D2. PRD location and format. Candidates: (a) `.appmaker/prd.md` (single project-level), (b) `.appmaker/product/prd.md` (under product subdirectory for future product artifacts), (c) `.appmaker/prds/<feature-id>.md` (per-feature), (d) embedded as expanded section in interview-result.yaml. Pick one default with rationale; ≥3 alternatives go to killed. PRD shape (regardless of location choice) MUST include Understanding section with 7 named subsections (per wu-005 lesson human_understanding): users / buyers / operators; domain invariants; identity model; trust boundaries; non-delegable human judgments; verifiable success criteria; failure modes / unacceptable outcomes. The verifiable-success-criteria subsection enforces wu-005 lesson verifiability_bias (every success criterion is auto-check OR human-review-with-explicit-criteria; unverifiable requirements turned into verifiable proxies or explicitly human-reviewed)."
  - "D3. When does PRD emerge? Triggered after interview-result.yaml has readiness.status in {ready, ready_with_override}; before any work_unit decomposition (to-issues / ADR-005 future). Specify: manual command (`appmaker prd`) vs automatic on interview promote vs human-on-demand; specify what happens if PRD is requested before interview is ready (fail-closed reject per R5)."
  - "D4. Is PRD a required gate before to-issues (decomposition)? Most likely YES per discipline (work_unit decomposition without product-level reference produces drifting features). But this is the place to decide explicitly. If yes, define gate semantics: PRD must exist with status ACCEPTED before decomposition WUs are created."
  - "D5. How does PRD consume interview-result.yaml? Field-by-field input mapping. PRD pulls from interview's `problem`, `scope`, `product`, `technical`, `risks` blocks; PRD elaborates these into product-level prose (workflows, user stories, acceptance criteria for product capabilities). Specify the consumption rule: every interview field must be either explicitly addressed or explicitly noted as out-of-PRD-scope."
  - "D6. ready_with_override behavior in PRD. Per ADR-002 §D6, interview's unresolved_ambiguities[] propagate to downstream context-packs. PRD specifically: must inherit unresolved_ambiguities[] (PRD has its own copy or references interview's by id), must surface them in a dedicated section (so product-level reading exposes them), must not silently resolve them. Specify: where in PRD do unresolved_ambiguities surface, what gate behavior PRD has when interview was ready_with_override."
  - "D7. Matt Pocock to-prd attribution + lessons-derived fields explicit mapping. Combined housekeeping: (a) attribution per ADR-002 §D5 model (inline in prompt source + mapping doc row + pinned commit hash); (b) memory-stream test — each of 12 wu-006-applicable lessons (8 wu-005 direct including 3 agentic_engineering from extended closeout + 4 broader from wu-003/wu-004) maps to a concrete element (PRD shape constraint including Understanding section subsections, gate semantics, ADR-004 self-check item, or downstream WU validation). Table format mandatory for the lessons mapping per WU-005 lesson adr_quality (cross-check claims against actual artifacts)."

