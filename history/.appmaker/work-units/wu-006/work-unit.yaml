# ---------------------------------------------------------------------------
# GOAL
# ---------------------------------------------------------------------------
goal: |
  Produce ADR-004 — a narrowly-scoped Architectural Decision Record that
  establishes PRD Synthesis as a lifecycle stage between Interview Phase
  (ADR-002) and Work_unit Decomposition (ADR-005, future). The PRD is the
  bridge: Interview reduces ambiguity into structured interview-result.yaml;
  PRD Synthesis turns that into a product-level reference document that
  downstream work_units (decomposition, implementation) read as their
  "what-to-build" source of truth.

  Inspiration: Matt Pocock /to-prd skill (engineering/to-prd/SKILL.md).
  AppMaker adapts the pattern as inspiration source, NOT runtime dependency
  (per ADR-002 §D5 attribution policy + ADR-001 §D12 adapter selection).

  Secondary output: append exactly one entry to docs/reference/matt-pocock-pattern-mapping.md
  (per WU-003 append-oriented ledger convention).

