# ---------------------------------------------------------------------------
# DECISIONS TO RESOLVE IN ADR-005
# ---------------------------------------------------------------------------
decisions_to_resolve:
  - "D1. Decomposition definition: what IS work_unit decomposition in AppMaker? Output of which lifecycle stage (post-PRD)? What does it produce (a set of vertical-slice work_units + relation graph)? How does it differ from PRD (product reference) and from individual implementation work_units (the slices themselves)?"
  - "D2. Vertical slice vs horizontal task + slice typing (HITL / AFK or AppMaker equivalent). Two coupled sub-decisions: (a) what constitutes a 'vertical slice' (independently testable / deployable / verifiable end-to-end thin feature; tracer bullet through ALL integration layers per Matt Pocock to-issues principle) vs a 'horizontal task' (one technical layer fragment) — horizontal task antipattern explicit in killed alternatives; (b) slice typing classification — Matt Pocock to-issues mandates each slice as HITL (human-in-the-loop, requires human interaction such as architectural decision or design review) or AFK (away-from-keyboard, agent-executable end-to-end without human interaction). ADR-005 must decide: (b1) adopt HITL/AFK literally; (b2) map to AppMaker-native terminology (e.g. `execution_class: human_required | autonomous` consistent with WU-005 lesson human_understanding for non-delegable judgments); (b3) drop typing entirely (rejected per WU-005 lesson human_understanding — non-delegable judgments must be marked explicitly per slice). Pick one with rationale; killed alternatives explicit. Slice typing is load-bearing because it propagates non-delegable human judgments from PRD Understanding section to per-WU level."
  - "D3. Decomposition output location and shape. Candidates: (a) `.appmaker/decomposition.md` single project-level (mirrors prd.md), (b) per-WU work_unit.yaml files emitted directly to `.appmaker/work-units/wu-NNN/`, (c) intermediate `.appmaker/decomposition.yaml` listing planned WUs as a graph then individual files materialized by separate command. Pick one with rationale; ≥3 alternatives killed."
  - "D4. Relation graph: blocked_by, depends_on, related_to. Specify which relations decomposition produces, where they live (in each work_unit.yaml? in a separate graph artifact?), how cycle detection works, how relation changes during execution are recorded."
  - "D5. Per-work_unit acceptance criteria propagation from PRD. How does each decomposed WU's acceptance_criteria derive from PRD success criteria (Understanding subsection 6 — verifiable per WU-005 lesson verifiability_bias)? Specify the propagation rule: every PRD success criterion must map to ≥1 decomposed WU's acceptance criterion; every WU acceptance criterion must trace back to PRD criterion or non-delegable judgment."
  - "D6. ready_with_override propagation through decomposition. Per ADR-002 §D6 + ADR-004 §D6, override propagates to downstream context-packs. Specify: how decomposed WUs inherit unresolved_ambiguities[] from PRD; per-WU filtering by scope_affected; if decomposition is itself ACCEPTED_WITH_INHERITED_OVERRIDE (when PRD was), how does it propagate further to individual WU context-packs."
  - "D7. Matt Pocock to-issues attribution + 16-lessons mapping table. Per ADR-002 §D5 model: inline attribution + mapping doc row + pinned commit hash. Plus memory-stream test table mapping each of 16 wu-007-applicable lessons to concrete elements (decomposition shape constraint, gate semantics, ADR-005 self-check item, mapping doc entry field). Per WU-006 lesson cross_decision_consistency_active_check: D7 mapping table cross-checked actively against the actual mapping doc entry being appended."

