# ---------------------------------------------------------------------------
# VERIFICATION
# ---------------------------------------------------------------------------
verification:
  primary_artifact:
    name: ADR-005
    schema: adr-v1
    required_sections:
      - "Status"
      - "Metadata"
      - "Context"
      - "Sources Consulted"
      - "Decision (numbered)"
      - "Killed Alternatives"
      - "Risks and Mitigations"
      - "Rollback Plan"
      - "Open Questions"
      - "Acceptance Criteria"
      - "Verification"
      - "Revision History"
    forbidden_patterns: ["TBD", "TODO", "..."]
    bounds_lines: { min: 250, max: 550 }
    minimum_decisions_resolved: 7
    minimum_alternatives_killed: 3
    lessons_traceability_required: true
    matt_pocock_attribution_required: true
    matt_pocock_pinned_commit_present: true
  secondary_artifacts:
    - name: matt-pocock-pattern-mapping-append
      type: ledger_append
      parser_validation: not_applicable
      content_alignment: "Single new entry (4th row) with 8 required fields; existing 3 entries unchanged (diff = 0)"
      forbidden_patterns_check: required
      cross_artifact_field_consistency: "Every field value cross-checked against ADR-005 D7 lessons-mapping claims (per WU-006 lesson #2)"
  cross_artifact_consistency_required: true
  cross_decision_consistency_active_step:                                 # NEW per WU-006 lesson #1
    required: true
    pairs_to_diff:
      - "D2 (vertical slice + slice typing HITL/AFK) ↔ D3 (output shape)"
      - "D2 (vertical slice + slice typing) ↔ D5 (per-WU acceptance criteria propagation) — vertical slice integrity must align with per-WU AC propagation; if slice typing chosen as execution_class, AC propagation rules must reference it"
      - "D3 (output shape) ↔ D4 (relation graph location) — output shape must accommodate relation graph storage (in single doc, per-WU files, or intermediate graph)"
      - "D3 (output shape) ↔ D5 (per-WU acceptance criteria propagation) — output shape must have explicit place for tracing each PRD success criterion → WU acceptance criterion mapping (e.g. AC tag pointing back to PRD criterion id)"
      - "D5 (acceptance criteria propagation) ↔ D6 (override propagation)"
      - "D6 (override propagation) ↔ ADR-004 §D6 (PRD override propagation; cross-ADR consistency)"
      - "D7 (lessons mapping) ↔ matt-pocock-pattern-mapping.md Entry 4 (cross-artifact)"
  within_decision_wording_consistency_required: true                      # NEW per WU-006 lesson #3
  human_review_required: true

  secondary_artifacts_policy:
