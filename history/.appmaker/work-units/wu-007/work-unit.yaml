  multi-output AND multi-decision AND has dense relations (PRD → issues →
  blocked_by → AC). Lessons #1 (cross_decision_active) and #2 (cross_artifact_active)
  are LOAD-BEARING for this WU; verification block elevates them to ACTIVE
