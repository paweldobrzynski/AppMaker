    - "verification.primary_artifact.required_sections_all_present: true"
    - "verification.primary_artifact.forbidden_patterns_absent: true"
    - "verification.primary_artifact.bounds_lines_within: true"
    - "verification.primary_artifact.minimum_decisions_resolved_met: true"
    - "verification.primary_artifact.minimum_alternatives_killed_met: true"
    - "verification.primary_artifact.lessons_traceability_pass: true"
    - "verification.primary_artifact.matt_pocock_attribution_present: true"
    - "verification.primary_artifact.matt_pocock_pinned_commit_present: true"
    - "verification.secondary_artifacts.status: pass OR deferred_with_rationale"
    - "verification.secondary_artifacts.content_alignment_pass: true"
    - "verification.cross_artifact_consistency_pass: true"
    - "verification.cross_decision_consistency_active_step.all_pairs_aligned: true"
    - "verification.within_decision_wording_consistency_pass: true"
    - "verification.mapping_doc_existing_entries_unchanged: pass"
    - validator_tooling_preflight.recorded: true
    - "review.human: pass"
  break_glass:
    allowed: false

# ---------------------------------------------------------------------------
# RISKS
# ---------------------------------------------------------------------------
risks:
  - "Scope creep into safety hooks / TDD / bug workflow / architecture review. Mitigation: Codex directive explicit; AC #5 enforces narrow scope; review_scorecard.scope_discipline tracks."
  - "D4 relation graph (blocked_by, depends_on) over-engineered without real decomposition usage. Mitigation: D4 conceptual not parseable; OQ for v2 schema when usage data exists."
  - "Cross-decision diff (per WU-006 lesson #1) may surface contradictions late. Mitigation: 5 pair-diffs explicit in verification block; reviewer must execute each; not optional scorecard."
  - "Cross-artifact consistency (per WU-006 lesson #2) particularly tricky here: ADR-005 D7 mapping ↔ mapping entry must agree on every field (status name, terminology, etc). Mitigation: explicit cross_artifact_field_consistency in secondary_artifacts verification."
  - "Within-decision wording drift (per WU-006 lesson #3) likely in long ADR-005 with 7 decisions. Mitigation: within_decision_wording_consistency_required enforced at self-check."
  - "Decomposition gate (D5 every PRD criterion → ≥1 WU) may produce too many WUs for trivial PRDs. Mitigation: Open Question for trivial-PRD shortcut; v1 strict, v2 may relax."
  - "ready_with_override propagation chain getting longer (interview → PRD → decomposition → individual WUs) — ambiguities pile. Mitigation: per-WU resolution removes from chain; future analytics."
  - "Matt Pocock to-issues 'publish to issue tracker' not adopted but might cause confusion. Mitigation: mapping doc note explicit about adaptation."

# ---------------------------------------------------------------------------
# ROLLBACK
# ---------------------------------------------------------------------------
rollback_plan: |
  Soft: future ADR (ADR-NNN) supersedes specific decisions in ADR-005 (e.g. D3 location changed from single decomposition.md to per-WU files); existing decomposition migrated via dedicated implementation WU. Mapping doc to-issues entry may be amended via dedicated work_unit with revision history per WU-003 convention.

  Hard: archive ADR-005 + mapping append (mark status REJECTED in revision history; mapping doc append removed via amendment with revision history note). AppMaker reverts to using PRD as informal decomposition source (no formal decomposition stage); downstream implementation WUs operate without decomposition gate. No production users affected (greenfield).

# ---------------------------------------------------------------------------
# NOTES
# ---------------------------------------------------------------------------
notes: |
